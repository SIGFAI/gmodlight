; GModLight: Garry's Mod spawn menu, physgun and physics inside Dying Light.
; Goes next to GModLight.asi in the Dying Light folder.

[Keys]
; Open Garry's Mod's spawn menu from anywhere (Q does it in Garry's Mod hands).
; F1..F24, a letter, or a virtual key number.
SpawnMenu=F1
; 1 = hold the key like Q in Garry's Mod, 0 = press once to open, again to close.
SpawnMenuHold=0
; Switch between plain Dying Light and Garry's Mod hands. In Garry's Mod hands, Dying Light
; keeps movement and looking; mouse buttons, the wheel (weapon wheel), 1-0 (weapon slots),
; R, E, Z (undo), Q (hold: spawn menu) and C (hold: context menu) go to Garry's Mod.
GModHands=F2
; Hide or show everything Garry's Mod draws.
ToggleOverlay=F7
; Write every object near you (class name and position) to GModLight.log.
DebugDump=F8
; Show the invisible boxes Garry's Mod uses for each zombie (green, orange while held).
DebugBoxes=F9
; Save what you see to GModLight_shots\ next to the plugin.
Screenshot=F10
; Spawn menu cursor speed, in percent.
CursorSpeedPercent=100

[GMod]
; Start Garry's Mod hidden when Dying Light loads into the world. 0 = start it yourself.
AutoStart=1
; Folder that contains gmod.exe. Empty = find it through Steam.
Path=
; Garry's Mod renders at Dying Light's aspect ratio, at most this wide.
MaxWidth=2560
ExtraArgs=

[Npcs]
; Mirror nearby Dying Light actors into Garry's Mod so the physgun can grab them.
Enabled=1
; Comma separated parts of class names to mirror. HumanAI is zombies and human NPCs
; (found with F8, DebugDump).
ClassContains=HumanAI
; Meters around you to mirror.
Radius=40
; Garry's Mod damage to a zombie's stand-in (bullets, crowbar, explosions, thrown props)
; is done to the real zombie, scaled by this much.
DamagePercent=500
; 1 = Dying Light's player counts as the attacker, the way the game always passes one.
PlayerIsAttacker=1
; Held and thrown zombies are carried on along their velocity between Garry's Mod's
; updates (66 a second), up to this many milliseconds, so they keep up with the physgun.
ExtrapolateMs=35
; On letting go, also move the zombie AI's own idea of where it is (stops snap-backs).
ReleaseFix=1

[Hands]
; In Garry's Mod hands, hide Dying Light's own arms/body and these attached objects.
HideOwnModel=1
HideClasses=PlayerFppVis,WeaponVis,ItemVis
; Only those within this many meters of the camera (loot on the ground stays visible).
HideRadius=3
; Also hide Dying Light's weapon HUD (held item, durability, weapon wheel, crosshair) while
; Garry's Mod's hands are out. Only HUD pieces that belong to these components alone.
HideWeaponHud=1
HideHudClasses=HudPrimaryWeaponIndicator,HudSecondaryWeaponIndicator,HudHeldItem,HudWeaponSelector,HudCrosshair

[Debug]
; Screenshots taken automatically in Garry's Mod hands (every 8 s, and on damage).
AutoScreenshots=12
; Zombie boxes (Garry's Mod's stand-ins) visible from the start. F9 toggles them either way.
BoxesOnStart=0

[Advanced]
; 1 = move, damage and trace Dying Light actors on the game's own update thread (safer).
; 0 = do it while drawing the frame, like versions before round 6.
GameThread=1
; 1 = follow the camera Dying Light renders with (includes camera shake and head bob),
; so Garry's Mod's things stay put on the world. 0 = the camera object, as before.
UseViewMatrix=1
; 1 = take the camera from the renderer's combined matrix: the view of the frame on
; screen, even if the camera has already moved on to the next frame.
UseRenderCamera=1
; 1 = Garry's Mod sends how far away its objects are, and Dying Light corrects them for
; head and body movement too (keeps near things like a grenade planted). 0 = turning only.
Parallax=1

[Performance]
; Dying Light frame cap (0 = none). 60 leaves the GPU room for Garry's Mod, so both run
; evenly paced instead of fighting over it (stutter, uneven alignment).
MaxFPS=60
; 1 = Garry's Mod draws exactly one frame per Dying Light frame, right after Dying Light's
; camera is ready: every frame is equally fresh (~one frame old), so things line up evenly.
Lockstep=1
